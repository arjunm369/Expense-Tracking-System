<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dashboard-container">
    <nav class="navbar">
        <h1>Expense Tracker</h1>
        <div class="nav-right">
            <span id="welcome-user"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="card">
            <h3>Add Expense</h3>
            <div class="form-group">
                <input type="date" id="expense-date" required>
            </div>
            <div class="form-group">
                <select id="expense-category">
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Others">Others</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="expense-description" placeholder="Description">
            </div>
            <div class="form-group">
                <input type="number" id="expense-amount" placeholder="Amount" step="0.01" required>
            </div>
            <button onclick="addExpense()">Add Expense</button>
        </div>

        <div class="card">
            <h3>View Expenses</h3>
            <div class="filter-group">
                <input type="date" id="filter-start" placeholder="From">
                <input type="date" id="filter-end" placeholder="To">
                <select id="filter-category">
                    <option value="">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Others">Others</option>
                </select>
                <button onclick="loadExpenses()">Filter</button>
            </div>
            <p id="total-expense" class="total-display"></p>
            <table id="expenses-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="expenses-body"></tbody>
            </table>
        </div>
    </div>
</div>
<script src="js/dashboard.js"></script>
</body>
</html>
